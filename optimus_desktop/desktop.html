<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OPTIMUS Desktop</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
/* ===================================================================
   CSS Variables — Theme
   =================================================================== */
:root {
    --bg:         #0a0a0f;
    --accent:     #00ff88;
    --text:       #e0e0e0;
    --text-dim:   #888;
    --card-bg:    #1a1a2e;
    --card-hover: #252545;
    --dock-bg:    rgba(10,10,15,0.95);
    --border:     #333355;
    --danger:     #ff4757;
    --warning:    #ffa502;
    --success:    #2ed573;
    --icon-size:  64px;
    --card-width: 160px;
    --card-gap:   20px;
}

/* ===================================================================
   Reset & Base
   =================================================================== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
    width: 100%; height: 100%;
    font-family: 'Segoe UI', 'Inter', 'Roboto', sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
}

/* ===================================================================
   Starfield Canvas (background)
   =================================================================== */
#starfield {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0; pointer-events: none;
}

/* ===================================================================
   Top Bar
   =================================================================== */
#topbar {
    position: fixed; top: 0; left: 0; right: 0;
    height: 44px;
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(10,10,15,0.92);
    border-bottom: 1px solid var(--border);
    padding: 0 20px;
    z-index: 100;
    backdrop-filter: blur(12px);
}
#topbar .logo {
    font-size: 16px; font-weight: 700; letter-spacing: 2px;
    color: var(--accent);
}
#topbar .logo i { margin-right: 6px; }
#topbar .sys-tray {
    display: flex; align-items: center; gap: 18px;
    font-size: 13px; color: var(--text-dim);
}
#topbar .sys-tray .stat { display: flex; align-items: center; gap: 5px; }
#topbar .sys-tray .stat i { font-size: 11px; color: var(--accent); }
#topbar .sys-tray .clock {
    font-weight: 600; color: var(--text);
    min-width: 62px; text-align: right;
}

/* ===================================================================
   Security Score Badge
   =================================================================== */
.score-badge {
    display: flex; align-items: center; gap: 8px;
    background: rgba(0,255,136,0.08);
    border: 1px solid rgba(0,255,136,0.25);
    border-radius: 8px;
    padding: 4px 12px; cursor: pointer;
    transition: background 0.2s;
}
.score-badge:hover { background: rgba(0,255,136,0.15); }
.score-badge .grade {
    font-size: 18px; font-weight: 800; color: var(--accent);
}
.score-badge .score-label {
    font-size: 11px; color: var(--text-dim); line-height: 1.2;
}

/* ===================================================================
   Main Desktop Area
   =================================================================== */
#desktop {
    position: fixed;
    top: 44px; left: 0; right: 0; bottom: 64px;
    overflow-y: auto; overflow-x: hidden;
    padding: 30px 40px;
    z-index: 10;
    display: flex; flex-wrap: wrap;
    align-content: flex-start;
    gap: var(--card-gap);
    justify-content: center;
}
#desktop::-webkit-scrollbar { width: 6px; }
#desktop::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* ===================================================================
   Program Cards
   =================================================================== */
.program-card {
    width: var(--card-width);
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 12px 14px;
    display: flex; flex-direction: column; align-items: center;
    cursor: pointer;
    transition: all 0.25s ease;
    position: relative;
}
.program-card:hover {
    background: var(--card-hover);
    transform: translateY(-4px);
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    border-color: var(--accent);
}
.program-card:active { transform: translateY(-1px) scale(0.97); }
.program-card .card-icon {
    width: var(--icon-size); height: var(--icon-size);
    display: flex; align-items: center; justify-content: center;
    font-size: 32px;
    border-radius: 14px;
    margin-bottom: 10px;
    transition: background 0.25s;
}
.program-card:hover .card-icon { background: rgba(255,255,255,0.05); }
.program-card .card-name {
    font-size: 13px; font-weight: 600;
    text-align: center; line-height: 1.25;
    margin-bottom: 4px;
}
.program-card .card-desc {
    font-size: 10px; color: var(--text-dim);
    text-align: center; line-height: 1.3;
    margin-bottom: 8px;
    max-height: 26px; overflow: hidden;
}
.program-card .card-status {
    font-size: 11px; display: flex; align-items: center; gap: 5px;
}
.program-card .card-status .dot {
    width: 8px; height: 8px; border-radius: 50%;
    display: inline-block;
}
.dot-running { background: var(--success); box-shadow: 0 0 8px var(--success); }
.dot-stopped { background: var(--danger); opacity: 0.6; }

/* Port badge */
.program-card .port-badge {
    position: absolute; top: 8px; right: 10px;
    font-size: 9px; color: var(--text-dim);
    background: rgba(255,255,255,0.04);
    padding: 2px 6px; border-radius: 4px;
}

/* Size variants */
.size-small .program-card { --card-width: 120px; --icon-size: 44px; }
.size-small .card-icon { font-size: 24px; }
.size-large .program-card { --card-width: 200px; --icon-size: 80px; }
.size-large .card-icon { font-size: 42px; }

/* List layout */
.layout-list { flex-direction: column; align-items: stretch; }
.layout-list .program-card {
    flex-direction: row; width: 100%; max-width: 600px;
    padding: 12px 18px; gap: 16px;
}
.layout-list .card-icon { margin-bottom: 0; width: 48px; height: 48px; font-size: 24px; }
.layout-list .card-desc { text-align: left; max-height: none; }

/* ===================================================================
   Bottom Dock
   =================================================================== */
#dock {
    position: fixed; bottom: 0; left: 0; right: 0;
    height: 64px;
    display: flex; align-items: center; justify-content: center;
    gap: 6px;
    background: var(--dock-bg);
    border-top: 1px solid var(--border);
    z-index: 100;
    backdrop-filter: blur(14px);
    padding: 0 24px;
}
.dock-btn {
    width: 48px; height: 48px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    background: rgba(255,255,255,0.04);
    border: 1px solid transparent;
    cursor: pointer;
    transition: all 0.2s ease;
    color: var(--text);
    position: relative;
}
.dock-btn:hover {
    background: rgba(255,255,255,0.1);
    transform: translateY(-4px);
    border-color: var(--border);
}
.dock-btn.active-dot::after {
    content: '';
    position: absolute; bottom: 2px; left: 50%;
    transform: translateX(-50%);
    width: 6px; height: 6px;
    background: var(--accent); border-radius: 50%;
}
.dock-sep {
    width: 1px; height: 32px;
    background: var(--border);
    margin: 0 10px;
}
.dock-btn.danger:hover { background: rgba(255,71,87,0.2); color: var(--danger); }

/* ===================================================================
   Context Menu
   =================================================================== */
#ctxmenu {
    display: none;
    position: fixed;
    min-width: 220px;
    background: #16162a;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 6px 0;
    z-index: 500;
    box-shadow: 0 12px 40px rgba(0,0,0,0.6);
}
#ctxmenu.show { display: block; }
.ctx-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.15s;
}
.ctx-item:hover { background: rgba(255,255,255,0.06); }
.ctx-item i { width: 18px; text-align: center; color: var(--accent); font-size: 13px; }
.ctx-sep { height: 1px; background: var(--border); margin: 4px 0; }
.ctx-sub { padding-left: 44px; }
.ctx-sub .swatch {
    display: inline-block; width: 18px; height: 18px;
    border-radius: 50%; border: 2px solid transparent;
    margin-right: 8px; cursor: pointer;
    transition: border 0.15s;
}
.ctx-sub .swatch:hover, .ctx-sub .swatch.sel { border-color: #fff; }

/* ===================================================================
   Notification Toasts
   =================================================================== */
#toasts {
    position: fixed; bottom: 76px; right: 20px;
    z-index: 400;
    display: flex; flex-direction: column-reverse; gap: 8px;
    max-height: 300px; overflow: hidden;
    pointer-events: none;
}
.toast {
    background: #16162a;
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 12px;
    animation: toastIn 0.35s ease;
    pointer-events: auto;
    max-width: 340px;
}
.toast .toast-time { font-size: 10px; color: var(--text-dim); margin-top: 3px; }
@keyframes toastIn {
    from { opacity: 0; transform: translateX(40px); }
    to   { opacity: 1; transform: translateX(0); }
}

/* ===================================================================
   System Info Panel (click score badge)
   =================================================================== */
#sysinfo-panel {
    display: none;
    position: fixed; top: 52px; right: 20px;
    width: 320px;
    background: #16162a;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
    z-index: 300;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
}
#sysinfo-panel.show { display: block; }
#sysinfo-panel h3 {
    font-size: 14px; margin-bottom: 12px;
    color: var(--accent); font-weight: 600;
}
.si-row {
    display: flex; justify-content: space-between;
    font-size: 12px; padding: 5px 0;
    border-bottom: 1px solid rgba(255,255,255,0.04);
}
.si-row .si-label { color: var(--text-dim); }
.si-row .si-val   { font-weight: 600; }
.si-bar-wrap {
    height: 6px; background: rgba(255,255,255,0.06);
    border-radius: 3px; margin-top: 4px; overflow: hidden;
}
.si-bar {
    height: 100%; border-radius: 3px;
    background: var(--accent);
    transition: width 0.5s ease;
}

/* ===================================================================
   Animations
   =================================================================== */
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
.pulse { animation: pulse 2s infinite; }
</style>
</head>
<body>

<!-- ================= Starfield Canvas ================= -->
<canvas id="starfield"></canvas>

<!-- ================= Top Bar ================= -->
<div id="topbar">
    <div class="logo"><i class="fa-solid fa-bolt"></i> OPTIMUS</div>
    <div class="sys-tray">
        <div class="score-badge" onclick="toggleSysInfo()" title="Security Posture Score">
            <span class="grade" id="score-grade">--</span>
            <span class="score-label">Security<br>Score</span>
        </div>
        <div class="stat"><i class="fa-solid fa-microchip"></i> <span id="cpu-stat">--%</span></div>
        <div class="stat"><i class="fa-solid fa-memory"></i> <span id="ram-stat">--%</span></div>
        <div class="stat"><i class="fa-solid fa-network-wired"></i> <span id="net-stat">--</span></div>
        <div class="clock" id="clock">--:--</div>
    </div>
</div>

<!-- ================= System Info Panel ================= -->
<div id="sysinfo-panel">
    <h3><i class="fa-solid fa-server"></i> System Information</h3>
    <div id="sysinfo-body">Loading...</div>
</div>

<!-- ================= Desktop Grid ================= -->
<div id="desktop"></div>

<!-- ================= Bottom Dock ================= -->
<div id="dock">
    <div class="dock-btn" onclick="launchQuick('netguard')"   title="NetGuard Pro"><i class="fa-solid fa-shield-halved"></i></div>
    <div class="dock-btn" onclick="launchQuick('sentinel')"   title="SentinelOS"><i class="fa-solid fa-satellite-dish"></i></div>
    <div class="dock-btn" onclick="launchQuick('mailshield')" title="MailShield Pro"><i class="fa-solid fa-envelope-open-text"></i></div>
    <div class="dock-btn" onclick="launchQuick('vpnguard')"   title="VPN Guard"><i class="fa-solid fa-lock"></i></div>
    <div class="dock-btn" onclick="launchQuick('siem')"       title="SIEM / SOAR"><i class="fa-solid fa-chart-line"></i></div>
    <div class="dock-sep"></div>
    <div class="dock-btn" onclick="openSettings()" title="Settings"><i class="fa-solid fa-gear"></i></div>
    <div class="dock-btn danger" onclick="shutdownAll()" title="Shutdown All"><i class="fa-solid fa-power-off"></i></div>
</div>

<!-- ================= Context Menu ================= -->
<div id="ctxmenu">
    <div class="ctx-item" onclick="refreshStatus()"><i class="fa-solid fa-arrows-rotate"></i> Refresh Status</div>
    <div class="ctx-sep"></div>
    <div class="ctx-item"><i class="fa-solid fa-palette"></i> Wallpaper</div>
    <div class="ctx-sub" id="ctx-wallpapers">
        <span class="swatch" style="background:#0a0a0f" onclick="setWallpaper('#0a0a0f')"></span>
        <span class="swatch" style="background:#0d1b2a" onclick="setWallpaper('#0d1b2a')"></span>
        <span class="swatch" style="background:#0a1a0a" onclick="setWallpaper('#0a1a0a')"></span>
        <span class="swatch" style="background:#1a0a0a" onclick="setWallpaper('#1a0a0a')"></span>
        <span class="swatch" style="background:#10101f" onclick="setWallpaper('#10101f')"></span>
        <span class="swatch" style="background:#1a0a1a" onclick="setWallpaper('#1a0a1a')"></span>
    </div>
    <div class="ctx-sep"></div>
    <div class="ctx-item"><i class="fa-solid fa-droplet"></i> Accent Color</div>
    <div class="ctx-sub" id="ctx-accents">
        <span class="swatch" style="background:#00ff88" onclick="setAccent('#00ff88')"></span>
        <span class="swatch" style="background:#36d1dc" onclick="setAccent('#36d1dc')"></span>
        <span class="swatch" style="background:#ff6b35" onclick="setAccent('#ff6b35')"></span>
        <span class="swatch" style="background:#a55eea" onclick="setAccent('#a55eea')"></span>
        <span class="swatch" style="background:#ff4757" onclick="setAccent('#ff4757')"></span>
        <span class="swatch" style="background:#ffa502" onclick="setAccent('#ffa502')"></span>
    </div>
    <div class="ctx-sep"></div>
    <div class="ctx-item"><i class="fa-solid fa-expand"></i> Icon Size</div>
    <div class="ctx-sub">
        <span class="ctx-item" onclick="setIconSize('small')">Small</span>
        <span class="ctx-item" onclick="setIconSize('medium')">Medium</span>
        <span class="ctx-item" onclick="setIconSize('large')">Large</span>
    </div>
    <div class="ctx-sep"></div>
    <div class="ctx-item" onclick="toggleLayout()"><i class="fa-solid fa-table-cells-large"></i> Toggle Grid / List</div>
    <div class="ctx-sep"></div>
    <div class="ctx-item" onclick="shutdownAll()"><i class="fa-solid fa-power-off" style="color:var(--danger)"></i> Shutdown All Agents</div>
</div>

<!-- ================= Toast Container ================= -->
<div id="toasts"></div>

<!-- ===================================================================
     JavaScript
     =================================================================== -->
<script>
/* ----- Global state -------------------------------------------------- */
window._optimus = {};
let _programs = [];
let _settings = { wallpaper:'#0a0a0f', accent:'#00ff88', icon_size:'medium', layout:'grid', theme:'default' };
let _sysinfoPanelOpen = false;
let _seenNotifIds = new Set();

const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

/* ----- Starfield ----------------------------------------------------- */
(function initStarfield(){
    const c = document.getElementById('starfield');
    const ctx = c.getContext('2d');
    let w, h, stars = [];
    function resize(){ w = c.width = window.innerWidth; h = c.height = window.innerHeight; }
    function makeStars(){
        stars = [];
        for(let i=0; i<180; i++){
            stars.push({
                x: Math.random()*w, y: Math.random()*h,
                r: Math.random()*1.2+0.3,
                a: Math.random()*0.6+0.2,
                dx: (Math.random()-0.5)*0.15,
                dy: (Math.random()-0.5)*0.1,
            });
        }
    }
    function draw(){
        ctx.clearRect(0,0,w,h);
        for(const s of stars){
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
            ctx.fillStyle = `rgba(200,220,255,${s.a})`;
            ctx.fill();
            s.x += s.dx; s.y += s.dy;
            if(s.x<0) s.x=w; if(s.x>w) s.x=0;
            if(s.y<0) s.y=h; if(s.y>h) s.y=0;
        }
        requestAnimationFrame(draw);
    }
    resize(); makeStars(); draw();
    window.addEventListener('resize', ()=>{ resize(); makeStars(); });
})();

/* ----- Clock --------------------------------------------------------- */
setInterval(()=>{
    const now = new Date();
    const hh = String(now.getHours()).padStart(2,'0');
    const mm = String(now.getMinutes()).padStart(2,'0');
    const ss = String(now.getSeconds()).padStart(2,'0');
    $('#clock').textContent = `${hh}:${mm}:${ss}`;
}, 1000);

/* ----- Render Programs Grid ------------------------------------------ */
function renderPrograms(programs){
    _programs = programs;
    const grid = $('#desktop');
    grid.innerHTML = '';
    for(const p of programs){
        const card = document.createElement('div');
        card.className = 'program-card';
        card.onclick = () => launchProgram(p.id);
        card.innerHTML = `
            <span class="port-badge">:${p.port}</span>
            <div class="card-icon" style="color:${p.color}">${p.emoji}</div>
            <div class="card-name">${p.name}</div>
            <div class="card-desc">${p.desc}</div>
            <div class="card-status">
                <span class="dot ${p.running?'dot-running':'dot-stopped'}"></span>
                ${p.running ? '<span style="color:var(--success)">Running</span>'
                            : '<span style="color:var(--text-dim)">Stopped</span>'}
            </div>
        `;
        grid.appendChild(card);
    }
    applySizeClass();
    applyLayoutClass();
    updateDockDots(programs);
}

/* ----- Dock active dots ---------------------------------------------- */
function updateDockDots(programs){
    const dockIds = ['netguard','sentinel','mailshield','vpnguard','siem'];
    const btns = $$('#dock .dock-btn');
    dockIds.forEach((id, i) => {
        const p = programs.find(x => x.id === id);
        if(p && p.running) btns[i].classList.add('active-dot');
        else btns[i].classList.remove('active-dot');
    });
}

/* ----- System Info Panel --------------------------------------------- */
function toggleSysInfo(){
    _sysinfoPanelOpen = !_sysinfoPanelOpen;
    $('#sysinfo-panel').classList.toggle('show', _sysinfoPanelOpen);
}
document.addEventListener('click', e => {
    if(_sysinfoPanelOpen && !e.target.closest('#sysinfo-panel') && !e.target.closest('.score-badge')){
        _sysinfoPanelOpen = false;
        $('#sysinfo-panel').classList.remove('show');
    }
});

function renderSysInfo(info){
    if(info.error){ $('#sysinfo-body').innerHTML = `<p style="color:var(--danger)">${info.error}</p>`; return; }
    $('#cpu-stat').textContent = info.cpu_percent + '%';
    $('#ram-stat').textContent = info.ram_percent + '%';
    $('#net-stat').textContent = `${info.net_recv_mb} MB`;
    $('#sysinfo-body').innerHTML = `
        <div class="si-row"><span class="si-label">Hostname</span><span class="si-val">${info.hostname}</span></div>
        <div class="si-row"><span class="si-label">OS</span><span class="si-val">${info.os}</span></div>
        <div class="si-row"><span class="si-label">IP Address</span><span class="si-val">${info.ip}</span></div>
        <div class="si-row"><span class="si-label">Uptime</span><span class="si-val">${info.uptime}</span></div>
        <div class="si-row"><span class="si-label">CPU</span><span class="si-val">${info.cpu_percent}%</span></div>
        <div class="si-bar-wrap"><div class="si-bar" style="width:${info.cpu_percent}%;background:${info.cpu_percent>80?'var(--danger)':'var(--accent)'}"></div></div>
        <div class="si-row"><span class="si-label">RAM</span><span class="si-val">${info.ram_used_gb} / ${info.ram_total_gb} GB (${info.ram_percent}%)</span></div>
        <div class="si-bar-wrap"><div class="si-bar" style="width:${info.ram_percent}%;background:${info.ram_percent>80?'var(--danger)':'var(--accent)'}"></div></div>
        <div class="si-row"><span class="si-label">Disk</span><span class="si-val">${info.disk_used_gb} / ${info.disk_total_gb} GB (${info.disk_percent}%)</span></div>
        <div class="si-bar-wrap"><div class="si-bar" style="width:${info.disk_percent}%;background:${info.disk_percent>85?'var(--danger)':'var(--accent)'}"></div></div>
        <div class="si-row"><span class="si-label">Net Sent</span><span class="si-val">${info.net_sent_mb} MB</span></div>
        <div class="si-row"><span class="si-label">Net Recv</span><span class="si-val">${info.net_recv_mb} MB</span></div>
    `;
}

/* ----- Score Badge --------------------------------------------------- */
function renderScore(score){
    const el = $('#score-grade');
    el.textContent = score.grade;
    const colors = {A:'#2ed573',B:'#7bed9f',C:'#ffa502',D:'#ff6348',F:'#ff4757'};
    el.style.color = colors[score.grade] || 'var(--accent)';
    el.title = `Score: ${score.score}/100 | Running: ${score.running}/${score.total} | Critical: ${score.critical_running}/${score.critical_total}`;
}

/* ----- Notifications ------------------------------------------------- */
function showToast(msg, color, timeStr){
    const container = $('#toasts');
    const t = document.createElement('div');
    t.className = 'toast';
    t.style.borderLeftColor = color || 'var(--accent)';
    t.innerHTML = `<div>${msg}</div><div class="toast-time">${timeStr || new Date().toLocaleTimeString()}</div>`;
    container.prepend(t);
    setTimeout(()=>{ t.style.opacity='0'; t.style.transition='opacity 0.5s'; setTimeout(()=>t.remove(), 600); }, 6000);
    // Keep max 5 visible
    while(container.children.length > 5) container.lastChild.remove();
}

function processNotifs(notifs){
    for(const n of notifs){
        const id = n.time + n.message;
        if(!_seenNotifIds.has(id)){
            _seenNotifIds.add(id);
            showToast(n.message, n.color, n.time);
        }
    }
}

/* ----- Callbacks from Python poller ---------------------------------- */
window._optimus.onStatusUpdate = function(data){ renderPrograms(data); };
window._optimus.onSysInfoUpdate = function(data){ renderSysInfo(data); };
window._optimus.onScoreUpdate = function(data){ renderScore(data); };
window._optimus.onNotifUpdate = function(data){ processNotifs(data); };

/* ----- API Calls ----------------------------------------------------- */
function api(){ return window.pywebview ? window.pywebview.api : null; }

async function launchProgram(id){
    const a = api(); if(!a) return;
    showToast(`Launching ${id}...`, 'var(--accent)');
    const res = await a.launch_program(id);
    if(res && res.ok === false) showToast(`Error: ${res.error}`, 'var(--danger)');
    setTimeout(refreshStatus, 2000);
}

async function launchQuick(id){ await launchProgram(id); }

async function refreshStatus(){
    const a = api(); if(!a) return;
    const status = await a.get_status();
    renderPrograms(status);
    const info = await a.get_system_info();
    renderSysInfo(info);
    const score = await a.get_security_score();
    renderScore(score);
}

async function shutdownAll(){
    if(!confirm('Shutdown ALL running agents?')) return;
    const a = api(); if(!a) return;
    showToast('Shutting down all agents...', 'var(--danger)');
    const res = await a.shutdown_all();
    if(res && res.stopped) showToast(`Stopped: ${res.stopped.join(', ')}`, 'var(--warning)');
    setTimeout(refreshStatus, 2000);
}

/* ----- Settings ------------------------------------------------------ */
async function loadSettings(){
    const a = api(); if(!a) return;
    const s = await a.load_settings();
    if(s) _settings = s;
    applySettings();
}

function applySettings(){
    document.documentElement.style.setProperty('--bg', _settings.wallpaper || '#0a0a0f');
    document.documentElement.style.setProperty('--accent', _settings.accent || '#00ff88');
    document.body.style.background = _settings.wallpaper || '#0a0a0f';
    applySizeClass();
    applyLayoutClass();
}

async function saveSettings(){
    const a = api(); if(!a) return;
    await a.save_settings(JSON.stringify(_settings));
}

function setWallpaper(color){
    _settings.wallpaper = color;
    applySettings(); saveSettings(); hideCtx();
}
function setAccent(color){
    _settings.accent = color;
    applySettings(); saveSettings(); hideCtx();
}
function setIconSize(size){
    _settings.icon_size = size;
    applySizeClass(); saveSettings(); hideCtx();
}
function applySizeClass(){
    const d = $('#desktop');
    d.classList.remove('size-small','size-medium','size-large');
    d.classList.add('size-' + (_settings.icon_size || 'medium'));
}
function toggleLayout(){
    _settings.layout = _settings.layout === 'grid' ? 'list' : 'grid';
    applyLayoutClass(); saveSettings(); hideCtx();
}
function applyLayoutClass(){
    const d = $('#desktop');
    d.classList.toggle('layout-list', _settings.layout === 'list');
}
function openSettings(){
    // Just show context menu centred
    const m = $('#ctxmenu');
    m.style.left = '50%'; m.style.top = '50%';
    m.style.transform = 'translate(-50%,-50%)';
    m.classList.add('show');
}

/* ----- Context Menu -------------------------------------------------- */
document.addEventListener('contextmenu', e => {
    e.preventDefault();
    const m = $('#ctxmenu');
    m.style.left = e.clientX + 'px';
    m.style.top  = e.clientY + 'px';
    m.style.transform = 'none';
    m.classList.add('show');
});
function hideCtx(){ $('#ctxmenu').classList.remove('show'); }
document.addEventListener('click', e => {
    if(!e.target.closest('#ctxmenu') || e.target.classList.contains('ctx-item')){
        // close after a small delay for swatch clicks
        setTimeout(()=>{ if(!e.target.classList.contains('swatch')) hideCtx(); }, 50);
    }
});

/* ----- Initial load -------------------------------------------------- */
document.addEventListener('DOMContentLoaded', async () => {
    // pywebview.api might not be ready immediately
    function waitForApi(cb, tries){
        if(window.pywebview && window.pywebview.api) return cb();
        if(tries > 30) return;
        setTimeout(()=> waitForApi(cb, (tries||0)+1), 200);
    }
    waitForApi(async () => {
        await loadSettings();
        await refreshStatus();
    });
});
</script>

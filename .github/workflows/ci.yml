name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install flake8
        run: pip install flake8
      - name: Run flake8
        run: flake8 --max-line-length=120 --ignore=E501,W503,E402 netguard.py optimus_desktop/desktop.py

  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgirepository1.0-dev gir1.2-webkit2-4.1 libpcap-dev
      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install psutil requests websockets cryptography scapy pytest
      - name: Run tests
        run: python -m pytest tests/ -v --tb=short || true
      - name: Import checks
        run: |
          python -c "import psutil; print('psutil OK')"
          python -c "import websockets; print('websockets OK')"
          python -c "import scapy; print('scapy OK')"
          python -c "import cryptography; print('cryptography OK')"

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck
      - name: Check shell scripts
        run: shellcheck -S warning launchers/*.sh optimus.sh install.sh || true

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install safety
        run: pip install safety pip-audit
      - name: Check dependencies for vulnerabilities
        run: pip-audit -r requirements.txt || true
